<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="xAA6CkWAFEGCM2Fo8Sb63pgByyfIiaUtLiXUUvWkFuA" />
    <!-- viewport-fit=cover ist Pflicht, sobald die App auf einem
         iPhone mit Dynamic Island laeuft: Ohne diesen Zusatz meldet
         iOS fuer env(safe-area-inset-*) ueberall 0. Die Leisten
         bekommen dann kein Polster, und der Inhalt scrollt sichtbar
         hinter Uhrzeit und Akkuanzeige durch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Habloo – Spanisch lernen mit echten Videos</title>
    <meta
      name="description"
      content="Lerne Spanisch mit YouTube-Videos, geführten Lektionen und einem Vokabeltrainer, der sich merkt, wann du wiederholen musst. Kostenlos starten."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habloo" />
    <!-- Farbe der Browserleiste auf dem Handy -->
    <meta name="theme-color" content="#ff6c00" />

    <!-- Vorschau beim Teilen in Chats und sozialen Netzwerken -->
    <meta property="og:title" content="Habloo – Spanisch lernen mit echten Videos" />
    <meta
      property="og:description"
      content="Videos mit mitlaufenden Untertiteln, Vokabeltrainer mit Gedächtnis und Lektionen vom ersten „Hola“ an."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://habloo.de/" />
    <meta property="og:locale" content="de_DE" />
      <link rel="preconnect" href="https://okwegzwsjrxusmznohis.supabase.co" crossorigin />
    <!-- Start-Logo: ploppt beim Öffnen kurz und weich auf, main.jsx blendet es aus -->
    <style>
      #start-logo { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #fdf7f1; transition: opacity .45s ease; }
      #start-logo img { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 18px 40px -14px rgba(255, 108, 0, .45); animation: start-pop .75s cubic-bezier(.34, 1.4, .64, 1) both; }
      #start-logo.weg { opacity: 0; pointer-events: none; }
      @keyframes start-pop { 0% { opacity: 0; transform: scale(.7); } 55% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #start-logo img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="start-logo" aria-hidden="true"><img src="/favicon.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
