<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Habloo-Logo: das ¡ auf orangem Badge.
       Das Zeichen ist als Formen gezeichnet (nicht als Schrift),
       damit es überall identisch aussieht. -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8124" />
      <stop offset="1" stop-color="#ff6c00" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#orange)" />

  <!-- Punkt oben -->
  <circle cx="32" cy="18" r="5.4" fill="#fff" />

  <!-- Strich darunter: oben breit, nach unten leicht schmaler,
       Unterkante abgerundet -->
  <path
    d="M27.2 29.4h9.6l-1 15.1a3.6 3.6 0 0 1-7.6 0l-1-15.1z"
    fill="#fff"
  />
</svg>
